<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mosaic Heart</title>
  <meta name="description" content="Every gift reveals a piece of the heart. Hover a colored section to meet its donor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@700&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="home">
  <div class="bg-anim" id="bg" aria-hidden="true"></div>
  <header class="top">
    <a class="race-logo" href="https://runsignup.com/Race/Donate/FL/Jacksonville/HealingHeartsWalk2020" target="_blank" rel="noopener" aria-label="Donate to the Jax Healing Hearts Race (opens RunSignup)">
      <img src="/jax-healing-hearts-race.jpg" alt="Jax Healing Hearts Race logo" width="321" height="309" />
    </a>
    <h1><span class="aurora"><span class="sr-only">Mosaic</span><span class="aurora-fill" aria-hidden="true">Mosaic</span></span> Heart</h1>
    <p class="sub">Every gift peels back a piece of the heart. Drag to turn it, tap a section to see its donor.</p>
  </header>
  <main class="layout">
    <section class="stage" id="stage" aria-label="3D heart"></section>
    <aside class="panel" id="panel">
      <button class="handle" id="handle" type="button" aria-expanded="false" aria-controls="drawer-body">
        <span class="grip" aria-hidden="true"></span>
        <span class="handle-row">
          <span><b id="raised-m">$0</b> raised &middot; <b id="count-m">0 / 17</b> revealed</span>
          <span class="chev" aria-hidden="true"></span>
        </span>
      </button>
      <div class="drawer-body" id="drawer-body">
      <a class="donate" href="https://runsignup.com/Race/Donate/FL/Jacksonville/HealingHeartsWalk2020" target="_blank" rel="noopener">
        <img src="/jax-healing-hearts-race.jpg" alt="" width="321" height="309" />
        <span class="donate-text"><b>Jax Healing Hearts Race</b><small>Give on RunSignup to fill in the heart</small></span>
        <span class="donate-btn">Donate</span>
      </a>
      <div class="stats">
        <div><span id="raised">$0</span><small>raised</small></div>
        <div><span id="count">0 / 17</span><small>sections revealed</small></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
      <button id="replay" class="ghost" type="button">&#8635; Replay reveal</button>
      <ul id="list" class="list"></ul>
      <a class="drawer-admin" href="/admin.html">Admin login</a>
      </div>
    </aside>
  </main>
  <div id="tip" class="tip" role="status" hidden></div>
  <div id="notice" class="notice" hidden></div>
  <footer class="site-foot"><a href="/admin.html">Admin login</a></footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
