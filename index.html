<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mosaic Heart</title>
  <meta name="description" content="Every team builds its own Mosaic Heart. Every gift peels back a piece of it." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@700&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="board-page">
  <div class="bg-anim" id="bg" aria-hidden="true"></div>
  <header class="top">
    <a class="race-logo" href="https://runsignup.com/Race/Donate/FL/Jacksonville/HealingHeartsWalk2020" target="_blank" rel="noopener" aria-label="Donate to the Jax Healing Hearts Race (opens RunSignup)">
      <img src="/jax-healing-hearts-race.jpg" alt="Jax Healing Hearts Race logo" width="321" height="309" />
    </a>
    <h1><span class="aurora"><span class="sr-only">Mosaic</span><span class="aurora-fill" aria-hidden="true">Mosaic</span></span> Heart</h1>
    <p class="sub">Every team builds its own heart. Every gift peels back a piece of it.</p>
  </header>
  <main class="board-wrap">
    <section class="board-head">
      <p class="board-total" id="board-total" aria-live="polite"></p>
      <a class="rainbow-btn" href="/admin?new=1">Create your team's heart</a>
    </section>
    <ol class="board" id="board" aria-label="Team hearts, most raised first"></ol>
    <div id="notice" class="notice" hidden></div>
  </main>
  <footer class="board-foot"><a class="rainbow-btn" href="/admin">Team admin</a></footer>
  <script type="module" src="/src/leaderboard.js"></script>
</body>
</html>
